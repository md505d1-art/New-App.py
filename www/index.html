<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Sprout</title>
  <meta name="description" content="GCSE revision, 34 languages, sign language and chess, with Hana as your study buddy. Works offline.">
  <meta name="theme-color" content="#5b3fd6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sprout">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192-v2.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v2.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // If the app fails to start, show the reason and a Reload button instead of a blank screen.
    (function () {
      var shown = false;
      function show(msg) {
        if (shown) return; var app = document.getElementById('app');
        if (app && app.children.length && !/^\s*$/.test(app.textContent)) return; // the app is running: ignore
        shown = true;
        app.innerHTML = '<div style="padding:40px 22px;font:16px -apple-system,system-ui,sans-serif;color:#1f1a3a;text-align:center">' +
          '<h2 style="margin:0 0 8px">Sprout couldn\'t start</h2><p style="color:#6b6585">Please send a screenshot of this screen.</p>' +
          '<pre style="white-space:pre-wrap;text-align:left;background:#f1edfd;padding:12px;border-radius:12px;font-size:12px">' +
          String(msg).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</pre>' +
          '<button onclick="location.reload()" style="margin-top:12px;padding:12px 22px;border:0;border-radius:99px;background:#5b3fd6;color:#fff;font:inherit;font-weight:700">Reload</button></div>';
      }
      window.addEventListener('error', function (e) { show((e.message || 'Error') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      setTimeout(function () { var app = document.getElementById('app'); if (app && !app.children.length) show('The app did not load (timed out). Check your connection, then tap Reload.'); }, 8000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
