name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME) with licenses accepted.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check chess data
        run: node scripts/check-gambits.mjs

      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sprout.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sprout-apk
          path: Sprout.apk

      - name: Publish to the "Latest APK" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Sprout – latest APK
          prerelease: true
          make_latest: false
          body: |
            Debug build of Sprout from commit ${{ github.sha }}.
            On your Android phone, download **Sprout.apk** below and open it.
            You may need to allow "Install unknown apps" for your browser.
          files: Sprout.apk
